body.is-phone{background-position:85% center}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

/* ================= HOST (beamer) ================= */
.host{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;font-size:min(1vw,1.78vh)}
.bar{display:flex;align-items:center;justify-content:space-between;padding:1.8em 3.6em 0;height:7em}
.bar img.cg{height:2.6em}
.bar .partner{font-size:1.35em;font-weight:500;letter-spacing:.06em;color:var(--t1);background:rgba(2,3,49,.7);border:1px solid var(--line);border-radius:3em;padding:.5em 1.2em;backdrop-filter:blur(6px)}
.bar .partner span{color:var(--aqua);margin:0 .3em}
.bar .event{font-size:1.25em;letter-spacing:.18em;text-transform:uppercase;color:var(--t3);font-weight:500}
.bar .event b{color:var(--t1);font-weight:500}
.rule{height:1px;margin:1.2em 3.6em 0;background:linear-gradient(90deg,transparent,rgba(29,184,242,.6),rgba(0,153,153,.6),transparent)}
#stage{flex:1;position:relative;padding:0 3.6em}
.scene{position:absolute;inset:0 3.6em 5.5em;animation:fadeIn .7s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(1.2em)}to{opacity:1;transform:none}}
.eyebrow{font-size:1.25em;letter-spacing:.22em;text-transform:uppercase;color:var(--aqua);font-weight:500}
.h-xl{font-size:6.6em;font-weight:700;line-height:1;letter-spacing:-.01em}
.h-q{font-size:3.1em;font-weight:500;line-height:1.15;max-width:22em}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--t3)}

/* lobby */
.lobby{display:grid;grid-template-columns:1fr 1fr;align-items:center;height:100%}
.lobby .left{display:flex;flex-direction:column;gap:2.4em;padding-bottom:4em}
.lobby .sub{font-size:2.2em;color:var(--t2);max-width:17em;line-height:1.3}
.steps{display:flex;gap:1.4em}
.step{display:flex;align-items:center;gap:.8em;font-size:1.35em;color:var(--t2);background:var(--card);border:1px solid var(--line);border-radius:3em;padding:.6em 1.2em .6em .7em}
.step i{font-style:normal;width:1.8em;height:1.8em;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:var(--navy);font-weight:700}
.joined{display:flex;align-items:baseline;gap:.5em}
.joined .n{font-size:7em;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.joined .l{font-size:1.8em;color:var(--t3)}
.qrwrap{justify-self:center;display:flex;flex-direction:column;align-items:center;gap:1.4em;padding-bottom:4em}
.qrcard{background:#fff;border-radius:2em;padding:1.6em;box-shadow:0 0 0 1px rgba(255,255,255,.4),0 0 6em rgba(0,213,208,.35),0 2em 5em rgba(0,0,0,.4)}
.qrcard svg{display:block;width:24em;height:24em}
.url{font-size:1.45em;color:var(--t2);letter-spacing:.02em}

/* question */
.qscene{display:grid;grid-template-columns:58% 1fr;gap:3em;height:100%;padding-top:1.2em}
.qhead{display:flex;flex-direction:column;gap:1.1em;margin-bottom:2em}
.pips{display:flex;gap:.6em;align-items:center}
.pip{width:2.8em;height:.45em;border-radius:1em;background:rgba(255,255,255,.15)}
.pip.on{background:var(--grad)}
.opts{display:flex;flex-direction:column;gap:.8em}
.opt{position:relative;display:grid;grid-template-columns:3em 1fr 6em;align-items:center;gap:1em;min-height:3.9em;padding:0 1.4em;border-radius:1.1em;background:var(--card);border:1px solid var(--line);overflow:hidden}
.opt .fill{position:absolute;inset:0;width:0;background:linear-gradient(90deg,rgba(29,184,242,.28),rgba(0,213,208,.18));transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.opt.top .fill{background:linear-gradient(90deg,rgba(29,184,242,.75),rgba(0,213,208,.55))}
.opt.top{border-color:rgba(0,213,208,.8);box-shadow:0 0 2.4em rgba(0,213,208,.25)}
.opt .k,.opt .t,.opt .p{position:relative}
.opt .k{width:2.2em;height:2.2em;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:1.1em;color:var(--t3);font-weight:500}
.opt .dot{width:.9em;height:.9em;border-radius:50%;display:inline-block}
.opt .t{font-size:1.6em;color:var(--t1)}
.opt .p{font-size:1.8em;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;opacity:0;transition:opacity .6s .6s}
.reveal .opt .p{opacity:1}
.side{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2em;padding-bottom:4em}
.count{text-align:center}
.count .n{font-size:11em;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.count .l{font-size:1.8em;color:var(--t3);margin-top:.3em}
.ring{width:22em;height:.5em;border-radius:1em;background:rgba(255,255,255,.12);overflow:hidden}
.ring i{display:block;height:100%;width:0;background:var(--grad);transition:width .6s}
.insight{width:100%;align-self:stretch;background:linear-gradient(160deg,rgba(10,30,90,.88),rgba(4,8,52,.9));border:1px solid rgba(0,213,208,.45);border-radius:1.6em;padding:2.2em 2.4em;box-shadow:0 0 4em rgba(0,213,208,.18);backdrop-filter:blur(6px)}
.tag{display:inline-flex;align-items:center;gap:.6em;font-size:1.1em;letter-spacing:.2em;text-transform:uppercase;color:var(--aqua);font-weight:500;margin-bottom:1.1em}
.tag:before{content:"";width:.7em;height:.7em;border-radius:50%;background:var(--aqua);box-shadow:0 0 1em var(--aqua);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.insight p{font-size:1.75em;line-height:1.42;color:var(--t1);min-height:7em}
.insight p .cur{display:inline-block;width:.5em;height:1em;background:var(--aqua);vertical-align:-.12em;margin-left:.1em;animation:pulse .8s infinite}
.stat{font-size:1.4em;color:var(--t3);margin-top:1em}

/* radar */
.radar{display:grid;grid-template-columns:1fr 36em 1fr;grid-template-rows:1fr auto;column-gap:2.6em;row-gap:1em;height:100%;align-items:center;padding-top:1em}
.rcol{display:flex;flex-direction:column;gap:2em}
.rcard{background:rgba(6,12,60,.85);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:1.5em;padding:1.8em 2em;animation:fadeIn .8s ease both}
.rcard .lab{font-size:1.1em;letter-spacing:.2em;text-transform:uppercase;color:var(--t3);margin-bottom:.8em}
.rcard .big{font-size:2.2em;font-weight:700;line-height:1.15}
.rcard .small{font-size:1.4em;color:var(--t2);margin-top:.5em;line-height:1.35}
.rcenter{display:flex;flex-direction:column;align-items:center;gap:1.2em}
.rcenter svg{width:34em;height:34em;overflow:visible}
.rsum{grid-column:1/-1;text-align:center;font-size:1.9em;line-height:1.4;max-width:44em;justify-self:center;color:var(--t1);padding:.8em 1.4em;border-radius:1em;background:rgba(14,16,44,.6);border:1px solid var(--line)}
.badge{position:absolute;left:0;bottom:-4.2em;font-size:1.15em;color:var(--t3);border:1px solid var(--line);border-radius:3em;padding:.55em 1.2em;background:rgba(0,0,0,.15)}
.badge b{color:var(--aqua);font-weight:500}

/* controls */
.controls{position:fixed;left:50%;bottom:1.4em;transform:translateX(-50%);display:flex;gap:.6em;align-items:center;padding:.6em;border-radius:3em;background:rgba(10,14,34,.75);border:1px solid var(--line);backdrop-filter:blur(8px);opacity:.12;transition:opacity .3s;z-index:5;font-size:min(1vw,1.78vh)}
.controls:hover,.controls.show{opacity:1}
.controls button{font-size:1.25em;padding:.7em 1.3em;border-radius:2em;color:var(--t2)}
.controls button:hover{background:rgba(255,255,255,.08)}
.controls .primary{background:var(--grad);color:var(--navy);font-weight:700}
.controls .primary:hover{filter:brightness(1.1);background:var(--grad)}
.controls .state{font-size:1.15em;color:var(--t3);padding:0 .8em;min-width:10em;text-align:center}
.pill{position:fixed;top:1em;left:50%;transform:translateX(-50%);font-size:min(1.05vw,1.9vh);padding:.4em 1em;border-radius:2em;z-index:6;letter-spacing:.06em}
.pill.demo{background:rgba(242,184,75,.15);border:1px solid rgba(242,184,75,.6);color:#F2D08A}
.conn{position:fixed;right:1.2em;bottom:1.2em;z-index:6;font-size:min(.95vw,1.7vh);color:var(--t4);display:flex;align-items:center;gap:.5em}
.conn i{width:.7em;height:.7em;border-radius:50%;background:#2FBF8F;box-shadow:0 0 .8em #2FBF8F}
.conn.off i{background:#E5616B;box-shadow:0 0 .8em #E5616B}

/* PIN overlay */
.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(8,10,28,.75);backdrop-filter:blur(10px)}
.pinbox{background:var(--navy);border:1px solid var(--line);border-radius:1.4em;padding:2.4em;width:min(26em,90vw);display:flex;flex-direction:column;gap:1em;font-size:16px}
.pinbox h2{font-size:1.4em;font-weight:500}
.pinbox input{font:inherit;font-size:1.6em;letter-spacing:.3em;text-align:center;padding:.5em;border-radius:.6em;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff}
.pinbox button{padding:.8em;border-radius:.6em;background:var(--grad);color:var(--navy);font-weight:700}
.pinbox .err{color:#F09AA1;font-size:.9em;min-height:1.2em}

/* ================= PHONE ================= */
.phone{position:relative;z-index:1;min-height:100%;height:100%;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));font-size:16px;overflow-y:auto}
.ptop{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 14px;border-bottom:1px solid var(--line)}
.ptop img.cg{height:20px}
.ptop .ppartner{font-size:12px;font-weight:500;color:var(--t2);letter-spacing:.04em}
.ptop .ppartner b{color:var(--aqua);font-weight:500}
.pbody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:22px 2px;animation:fadeIn .5s ease both}
.pbody h1{font-size:26px;font-weight:700;line-height:1.2}
.pbody .lead{font-size:17px;color:var(--t2);line-height:1.45}
.pq{font-size:22px;font-weight:500;line-height:1.3}
.pbtns{display:flex;flex-direction:column;gap:10px}
.pbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:17px;line-height:1.3;color:var(--t1);transition:transform .15s,background .2s,border-color .2s}
.pbtn:active{transform:scale(.98)}
.pbtn i{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;color:var(--t3)}
.pbtn.sel{background:linear-gradient(90deg,rgba(29,184,242,.35),rgba(0,213,208,.22));border-color:var(--aqua)}
.pbtn.sel i{background:var(--aqua);color:var(--navy);border-color:var(--aqua)}
.pbtns.locked .pbtn:not(.sel){opacity:.45}
.done{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;border:1px solid rgba(0,213,208,.5);background:rgba(0,213,208,.08);font-size:16px;color:var(--t2)}
.orb{flex:none;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(0,213,208,.25),0 0 22px 6px rgba(0,213,208,.6)}
.pfoot{font-size:12px;color:var(--t4);text-align:center;line-height:1.5}
.pcount{font-size:13px;color:var(--t3);letter-spacing:.14em;text-transform:uppercase}
</style>
</head>

  const qr = qrcode(0, "M"); qr.addData(text); qr.make();
  const n = qr.getModuleCount(), m = 2; let d = "";
  for (let r=0;r<n;r++) for (let c=0;c<n;c++) if (qr.isDark(r,c)) d += `M${c+m} ${r+m}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges" aria-label="QR code to join"><path fill="#121A38" d="${d}"/></svg>`;
}

/* ============ HOST ============ */
function startHost(){
  $("#host").hidden = false;
  if (DEMO) $("#demoPill").hidden = false;
  let S = DEMO ? Demo.state : { session:null, q:0, phase:"lobby" };
  let VOTES = [], A = aggregate([]), sceneKey = "", lastCount = 0, PIN = sstore.get("rr_pin") || "", busy = false;
  const stage = $("#stage");

  function seqIndex(){ return Math.max(0, SEQ.findIndex(s => s.q===S.q && s.phase===S.phase)); }
  function labelFor(s){ return s.phase==="lobby" ? "Lobby" : s.phase==="radar" ? "Room Radar" : `Q${s.q} · ${s.phase==="vote"?"voting":"results"}`; }
  function nextLabel(){ const i = seqIndex(), n = SEQ[i+1]; if (!n) return "End"; return n.phase==="vote" ? `Q${n.q} ▶` : n.phase==="reveal" ? "Reveal ▶" : "Room Radar ▶"; }

  function setConn(ok, text){ const el = $("#conn"); el.classList.toggle("off", !ok); el.querySelector("span").textContent = text; }

  function renderScene(){
    const key = S.session + "|" + S.q + "|" + S.phase;
    if (key === sceneKey) return updateScene();
    const prev = sceneKey.split("|"); sceneKey = key;
    if (prev[1] !== String(S.q) || prev[0] !== S.session) { BG.clearNodes(); lastCount = 0; }
    BG.setColorMode(S.phase === "reveal");
    $("#cState").textContent = labelFor(S); $("#bNext").textContent = nextLabel();
    if (S.phase === "lobby"){
      BG.place(.73,.56,1);
      stage.innerHTML = `<section class="scene lobby">
        <div class="left">
          <div class="eyebrow">From AI inspiration to tangible Siemens OCM solutions</div>
          <div class="h-xl">Room <span class="grad-text">Radar</span></div>
          <div class="sub">Where does this room stand on AI in change? Four questions, answered live and anonymously.</div>
          <div class="steps"><div class="step"><i>1</i>Scan the code</div><div class="step"><i>2</i>Watch the screen</div><div class="step"><i>3</i>Tap your answer</div></div>
          <div class="joined"><span class="n" id="jn">0</span><span class="l">in the room</span></div>
        </div>
        <div class="qrwrap"><div class="qrcard">${qrSvg(joinUrl())}</div><div class="url">${esc(joinUrl().replace(/^https?:\/\//,""))}</div></div>
      </section>`;
    } else if (S.phase === "vote" || S.phase === "reveal"){
      const Q = QS[S.q], rev = S.phase === "reveal";
      BG.place(rev ? .80 : .79, rev ? .60 : .55, rev ? .75 : 1.05);
      stage.innerHTML = `<section class="scene qscene ${rev?"reveal":""}">
        <div>
          <div class="qhead">
            <div class="pips">${[1,2,3,4].map(i=>`<span class="pip ${i<=S.q?"on":""}"></span>`).join("")}<span class="eyebrow" style="margin-left:1em">Question ${S.q} of 4 · ${esc(Q.label)}</span></div>
            <div class="h-q">${esc(Q.q)}</div>
          </div>
          <div class="opts">${Q.opts.map((o,i)=>`<div class="opt" data-i="${i}"><span class="fill"></span><span class="k">${rev?`<span class="dot" style="background:${OPT_COLORS[i]}"></span>`:String.fromCharCode(65+i)}</span><span class="t">${esc(o)}</span><span class="p">0%</span></div>`).join("")}</div>
        </div>
        <div class="side">${rev
          ? `<div class="insight"><div class="tag">Auto-insight</div><p id="ins"></p><div class="stat" id="stat"></div></div>`
          : `<div class="count"><div class="n" id="vn">0</div><div class="l">votes in</div></div><div class="ring"><i id="vr"></i></div><div class="muted" style="font-size:1.4em" id="vof"></div>`}
        </div>
      </section>`;
      if (rev) typeInsight();
    } else if (S.phase === "radar"){
      BG.place(.5,.47,.62);
      const R = radarSummary(A);
      stage.innerHTML = `<section class="scene radar">
        <div class="rcol">
          <div class="rcard" style="animation-delay:.2s"><div class="lab">Who is here</div><div class="big">${esc(R.o1)}</div><div class="small">${A.joined} people in the room</div></div>
          <div class="rcard" style="animation-delay:.4s"><div class="lab">AI pulse</div><div class="big"><span class="grad-text">${R.w}%</span> weekly+</div><div class="small">use generative AI at least weekly</div></div>
        </div>
        <div class="rcenter">${radarSvg(A)}</div>
        <div class="rcol">
          <div class="rcard" style="animation-delay:.6s"><div class="lab">Room maturity</div><div class="big">${esc(R.l3)}</div><div class="small">largest group on the AI journey</div></div>
          <div class="rcard" style="animation-delay:.8s"><div class="lab">Biggest value</div><div class="big">${esc(R.v4)}</div><div class="small">our mission for the gallery walk</div></div>
        </div>
        <div class="rsum">${R.text}</div>
        <div class="badge">Built with AI by <b>Capgemini Invent</b> · vibe-coded for tonight</div>
      </section>`;
    }
    updateScene();
  }

  function radarSvg(A){
    const c = A.per[3], t = A.tot[3] || 1, max = Math.max(1, ...c), R = 150, cx = 200, cy = 200, n = 5;
    const pt = (i, r) => { const a = -Math.PI/2 + i*2*Math.PI/n; return [cx + Math.cos(a)*r, cy + Math.sin(a)*r]; };
    let grid = ""; for (const f of [.25,.5,.75,1]) grid += `<polygon points="${[...Array(n)].map((_,i)=>pt(i,R*f).join(",")).join(" ")}" fill="none" stroke="rgba(255,255,255,${f===1?.3:.12})"/>`;
    let axes = ""; for (let i=0;i<n;i++){ const [x,y]=pt(i,R); axes += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(255,255,255,.15)"/>`; }
    const poly = [...Array(n)].map((_,i)=>pt(i, R*(.12 + .88*c[i]/max)).join(",")).join(" ");
    let labels = ""; for (let i=0;i<n;i++){ const [x,y]=pt(i,R+34); labels += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" fill="#DCE2EE" font-size="14">${esc(QS[3].short[i])}</text><text x="${x}" y="${y+18}" text-anchor="middle" fill="#00D5D0" font-size="13" font-weight="700">${pct(c[i],t)}%</text>`; }
    let dots = ""; for (let i=0;i<n;i++){ const [x,y]=pt(i, R*(.12 + .88*c[i]/max)); dots += `<circle cx="${x}" cy="${y}" r="5" fill="#fff" filter="url(#gl)"/>`; }
    return `<svg viewBox="0 0 400 400" aria-label="Room maturity radar">
      <defs><radialGradient id="rf"><stop offset="0" stop-color="#00D5D0" stop-opacity=".55"/><stop offset="1" stop-color="#1DB8F2" stop-opacity=".2"/></radialGradient>
      <filter id="gl"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
      ${grid}${axes}
      <g style="transform-origin:200px 200px;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both">
        <polygon points="${poly}" fill="url(#rf)" stroke="#00D5D0" stroke-width="2"/>${dots}</g>
      ${labels}
      <text x="200" y="398" text-anchor="middle" fill="#A6AFCB" font-size="12" letter-spacing="2">ROOM MATURITY · DIRECTIONAL SNAPSHOT</text>
      <style>@keyframes grow{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}</style>
    </svg>`;
  }

  let typer = null;
  function typeInsight(){
    const el = $("#ins"); if (!el) return;
    const text = insightFor(S.q, A); let i = 0; clearInterval(typer);
    el.innerHTML = '<span class="cur"></span>';
    setTimeout(() => {
      typer = setInterval(() => {
        i += 2; el.innerHTML = esc(text.slice(0,i)) + '<span class="cur"></span>';
        if (i >= text.length){ clearInterval(typer); el.innerHTML = esc(text); }
      }, 22);
    }, 900);
    const st = $("#stat"); if (st) st.textContent = `Based on ${A.tot[S.q]} anonymous votes · directional snapshot`;
  }

  function updateScene(){
    if (S.phase === "lobby"){
      const el = $("#jn"); if (el) el.textContent = A.joined;
      if (A.joined > lastCount){ BG.spawn(Math.min(12, A.joined-lastCount), null); lastCount = A.joined; }
    } else if (S.phase === "vote" || S.phase === "reveal"){
      const t = A.tot[S.q], c = A.per[S.q];
      if (S.phase === "vote"){
        const vn = $("#vn"); if (vn) vn.textContent = t;
        const vr = $("#vr"); if (vr) vr.style.width = (A.joined ? Math.min(100, t*100/A.joined) : 0) + "%";
        const vof = $("#vof"); if (vof) vof.textContent = A.joined ? `of ${A.joined} in the room` : "";
        if (t > lastCount){
          const newVotes = VOTES.filter(v=>v.q===S.q).slice(lastCount);
          newVotes.slice(0,12).forEach(v => BG.spawn(1, v.opt)); lastCount = t;
        }
      } else {
        const max = Math.max(...c);
        stage.querySelectorAll(".opt").forEach(row => {
          const i = +row.dataset.i, p = pct(c[i], t);
          row.querySelector(".fill").style.width = (t ? Math.max(2, c[i]*100/Math.max(1,max)) : 0) + "%";
          row.querySelector(".p").textContent = p + "%";
          row.classList.toggle("top", t>0 && c[i]===max);
        });
        if (t > lastCount){ VOTES.filter(v=>v.q===S.q).slice(lastCount).slice(0,12).forEach(v => BG.spawn(1, v.opt)); lastCount = t; }
      }
    }
  }

  async function tick(){
    if (DEMO){
      Demo.step(); S = Demo.state; VOTES = Demo.votes.slice(); A = aggregate(VOTES);
      setConn(true, `Demo · ${A.joined} simulated`);
    } else {
      try { S = await getState(); VOTES = await getVotes(S.session); A = aggregate(VOTES); setConn(true, `Live · ${A.joined} connected`); }
      catch(e){ setConn(false, "Offline — retrying…"); }
    }
    renderScene();
  }

  async function go(target, newSession){
    if (busy) return; busy = true;
    try {
      if (DEMO){ Demo.set(target.q, target.phase, newSession); S = Demo.state; if (newSession){ VOTES=[]; A=aggregate([]); } }
      else { S = await rpc("rr_control", { p_pin: PIN, p_q: target.q, p_phase: target.phase, p_new_session: !!newSession }); if (newSession){ VOTES=[]; A=aggregate([]); } }
      renderScene();
    } catch(e){ setConn(false, "Control failed — check PIN/connection"); }
    finally { busy = false; }
  }
  const next = () => { const i = seqIndex(); if (SEQ[i+1]) go(SEQ[i+1]); };
  const back = () => { const i = seqIndex(); if (i>0) go(SEQ[i-1]); };
  const reset = () => { if (confirm("Start a new session? All current votes will be hidden from the screen.")) go(SEQ[0], true); };
  const full = () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch(e){} };

  $("#bNext").onclick = next; $("#bBack").onclick = back; $("#bReset").onclick = reset; $("#bFull").onclick = full;
  addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    if (e.key==="ArrowRight" || e.key===" " || e.key==="PageDown"){ e.preventDefault(); next(); }
    else if (e.key==="ArrowLeft" || e.key==="PageUp"){ e.preventDefault(); back(); }
    else if (e.key==="f" || e.key==="F") full();
    else if (e.key==="r" || e.key==="R") reset();
  });
  let hideT; addEventListener("mousemove", () => { $("#controls").classList.add("show"); clearTimeout(hideT); hideT = setTimeout(()=>$("#controls").classList.remove("show"), 2500); });

  function begin(){ tick(); setInterval(tick, POLL_MS); }
  if (DEMO) return begin();
  // live: unlock with PIN
  const tryPin = async (p) => { try { return await rpc("rr_check_pin", { p_pin: p }) === true; } catch(e){ return false; } };
  (async () => {
    if (PIN && await tryPin(PIN)) return begin();
    $("#pinOverlay").hidden = false; $("#pinInput").focus();
    const submit = async () => {
      const p = $("#pinInput").value.trim(); $("#pinErr").textContent = "Checking…";
      if (await tryPin(p)){ PIN = p; sstore.set("rr_pin", p); $("#pinOverlay").hidden = true; begin(); }
      else $("#pinErr").textContent = "Wrong PIN or no connection to the database.";
    };
    $("#pinBtn").onclick = submit; $("#pinInput").onkeydown = e => { if (e.key==="Enter") submit(); };
  })();
}

/* ============ PHONE ============ */
function startPhone(){
  $("#phone").hidden = false; document.body.classList.add("is-phone");
  if (DEMO){ const p = $("#demoPill"); p.hidden = false; p.style.top = "auto"; p.style.bottom = "34px"; p.style.fontSize = "11px"; }
  BG.place(.5,.16,.55);
  const body = $("#pbody");
  let S = null, key = "", joinedSession = null, failures = 0;
  // demo phone: local walkthrough
  let demoState = { session:"demo", q:0, phase:"lobby" };
  const votedKey = (s,q) => "rr_v_" + s + "_" + q;

  function render(){
    if (!S){ body.innerHTML = `<div class="pcount">Connecting</div><h1>Joining the room…</h1>`; return; }
    const k = S.session + "|" + S.q + "|" + S.phase + "|" + (store.get(votedKey(S.session,S.q))||"");
    if (k === key) return; key = k;
    if (S.phase === "lobby"){
      body.innerHTML = `<div class="pcount">AI-Accelerated OCM Night · Siemens</div><h1>You're in the <span class="grad-text">Room Radar</span>.</h1>
        <div class="done"><span class="orb"></span>Your dot just joined the orbit on the big screen.</div>
        <p class="lead">Keep this page open. The first question appears here automatically.</p>
        ${DEMO ? `<button class="pbtn" id="dStart"><i>▶</i>Demo: start questions</button>` : ""}`;
      if (DEMO) $("#dStart").onclick = () => { demoState = { ...demoState, q:1, phase:"vote" }; S = demoState; render(); };
    } else if (S.phase === "vote" || S.phase === "reveal"){
      const Q = QS[S.q], mine = store.get(votedKey(S.session,S.q));
      const locked = mine !== null || S.phase === "reveal";
      body.innerHTML = `<div class="pcount">Question ${S.q} of 4</div><div class="pq">${esc(Q.q)}</div>
        <div class="pbtns ${locked?"locked":""}">${Q.opts.map((o,i)=>`<button class="pbtn ${String(i)===mine?"sel":""}" data-i="${i}" ${locked?"disabled":""}><i>${String.fromCharCode(65+i)}</i>${esc(o)}</button>`).join("")}</div>
        ${mine!==null ? `<div class="done"><span class="orb"></span>${S.phase==="reveal" ? "Results are on the big screen." : "Vote counted. Watch your dot fly in on the big screen."}</div>`
                      : S.phase==="reveal" ? `<div class="done"><span class="orb"></span>Voting closed. Results are on the big screen.</div>` : ""}`;
      body.querySelectorAll(".pbtn").forEach(b => b.onclick = () => vote(+b.dataset.i));
    } else {
      body.innerHTML = `<div class="pcount">Thank you</div><h1>That's our <span class="grad-text">Room Radar</span>.</h1>
        <p class="lead">Take your answer from the last question into the gallery walk. Enjoy the evening!</p>`;
    }
  }
  async function vote(i){
    if (store.get(votedKey(S.session,S.q)) !== null) return;
    if (navigator.vibrate) try{ navigator.vibrate(30); }catch(e){}
    if (DEMO){
      store.set(votedKey(S.session,S.q), String(i)); render();
      setTimeout(() => { demoState = demoState.q < 4 ? { ...demoState, q: demoState.q+1 } : { ...demoState, q:0, phase:"radar" }; S = demoState; render(); }, 1400);
      return;
    }
    const btns = body.querySelectorAll(".pbtn"); btns.forEach(b => b.disabled = true);
    try { await postVote(S.session, S.q, i); store.set(votedKey(S.session,S.q), String(i)); key = ""; render(); }
    catch(e){ btns.forEach(b => b.disabled = false); alert("Your vote didn't go through. Please tap again."); }
  }
  async function tick(){
    if (DEMO){ if (!S){ S = demoState; } render(); return; }
    try {
      S = await getState(); failures = 0;
      if (joinedSession !== S.session){ await postVote(S.session, 0, 0).catch(()=>{}); joinedSession = S.session; }
    } catch(e){ failures++; if (failures === 3 && !S) body.innerHTML = `<div class="pcount">No connection</div><h1>Retrying…</h1><p class="lead">Check your mobile data or Wi-Fi. The page reconnects automatically.</p>`; }
    render();
  }
  tick(); setInterval(tick, POLL_MS + 300);
}

/* ============ BOOT ============ */
IS_HOST ? startHost() : startPhone();
</script>
</body>
