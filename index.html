:root{
  --navy:#121A38; --night:#020331; --deep:#06104A;
  --cyan:#1DB8F2; --teal:#009999; --aqua:#00D5D0; --cg:#0058AB;
  --t1:#FFFFFF; --t2:#DCE2EE; --t3:#A6AFCB; --t4:#7C86A8;
  --card:rgba(255,255,255,.055); --card2:rgba(255,255,255,.09); --line:rgba(255,255,255,.14);
  --grad:linear-gradient(90deg,var(--cyan),var(--aqua));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Ubuntu",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--t1);overflow:hidden;
  background:radial-gradient(80% 70% at 88% 6%,rgba(0,88,171,.42),transparent 62%),radial-gradient(60% 55% at 102% 98%,rgba(0,213,208,.13),transparent 60%),radial-gradient(70% 60% at 0% 100%,rgba(29,40,120,.35),transparent 60%),linear-gradient(160deg,#050a44 0%,#020331 55%,#01022a 100%);background-attachment:fixed;-webkit-font-smoothing:antialiased}
#px{position:fixed;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

/* ================= HOST (beamer) ================= */
.host{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;font-size:min(1vw,1.78vh)}
.bar{display:flex;align-items:center;justify-content:space-between;padding:1.8em 3.6em 0;height:7em}
.bar img.cg{height:2.6em}
.bar .partner{font-size:1.35em;font-weight:500;letter-spacing:.06em;color:var(--t1);background:rgba(2,3,49,.7);border:1px solid var(--line);border-radius:3em;padding:.5em 1.2em;backdrop-filter:blur(6px)}
.bar .partner span{color:var(--aqua);margin:0 .3em}
.bar .event{font-size:1.25em;letter-spacing:.18em;text-transform:uppercase;color:var(--t3);font-weight:500}
.bar .event b{color:var(--t1);font-weight:500}
.rule{height:1px;margin:1.2em 3.6em 0;background:linear-gradient(90deg,transparent,rgba(29,184,242,.6),rgba(0,153,153,.6),transparent)}
#stage{flex:1;position:relative;padding:0 3.6em}
.scene{position:absolute;inset:0 3.6em 5.5em;animation:sceneIn .6s ease both}
@keyframes sceneIn{from{opacity:0}to{opacity:1}}
.h-xl,.h-q,.rsum{transition:opacity .35s}
.pxhide{opacity:0!important;transition:none!important}
@keyframes fadeIn{from{opacity:0;transform:translateY(1.2em)}to{opacity:1;transform:none}}
.eyebrow{font-size:1.25em;letter-spacing:.22em;text-transform:uppercase;color:var(--aqua);font-weight:500}
.h-xl{font-size:6.6em;font-weight:700;line-height:1;letter-spacing:-.01em}
.h-q{font-size:3.1em;font-weight:500;line-height:1.15;max-width:22em}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--t3)}

/* lobby */
.lobby{display:grid;grid-template-columns:1fr 1fr;align-items:center;height:100%}
.lobby .left{display:flex;flex-direction:column;gap:2.4em;padding-bottom:4em}
.lobby .sub{font-size:2.2em;color:var(--t2);max-width:17em;line-height:1.3}
.steps{display:flex;gap:1.4em}
.step{display:flex;align-items:center;gap:.8em;font-size:1.35em;color:var(--t2);background:var(--card);border:1px solid var(--line);border-radius:3em;padding:.6em 1.2em .6em .7em}
.step i{font-style:normal;width:1.8em;height:1.8em;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:var(--navy);font-weight:700}
.joined{display:flex;align-items:baseline;gap:.5em}
.joined .n{font-size:7em;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.joined .l{font-size:1.8em;color:var(--t3)}
.qrwrap{justify-self:center;display:flex;flex-direction:column;align-items:center;gap:1.4em;padding-bottom:4em}
.qrcard{background:#fff;border-radius:2em;padding:1.6em;box-shadow:0 0 0 1px rgba(255,255,255,.4),0 0 6em rgba(0,213,208,.35),0 2em 5em rgba(0,0,0,.4)}
.qrcard svg{display:block;width:24em;height:24em}
.url{font-size:1.45em;color:var(--t2);letter-spacing:.02em}

/* question */
.qscene{display:grid;grid-template-columns:58% 1fr;gap:3em;height:100%;padding-top:1.2em}
.qhead{display:flex;flex-direction:column;gap:1.1em;margin-bottom:2em}
.pips{display:flex;gap:.6em;align-items:center}
.pip{width:2.8em;height:.45em;border-radius:1em;background:rgba(255,255,255,.15)}
.pip.on{background:var(--grad)}
.opts{display:flex;flex-direction:column;gap:.8em}
.opt{position:relative;display:grid;grid-template-columns:3em 1fr 6em;align-items:center;gap:1em;min-height:3.9em;padding:0 1.4em;border-radius:1.1em;background:var(--card);border:1px solid var(--line);overflow:hidden}
.opt .fill{position:absolute;inset:0;width:0;background:linear-gradient(90deg,rgba(29,184,242,.28),rgba(0,213,208,.18));transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.opt.top .fill{background:linear-gradient(90deg,rgba(29,184,242,.75),rgba(0,213,208,.55))}
.opt.top{border-color:rgba(0,213,208,.8);box-shadow:0 0 2.4em rgba(0,213,208,.25)}
.opt .k,.opt .t,.opt .p{position:relative}
.opt .k{width:2.2em;height:2.2em;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:1.1em;color:var(--t3);font-weight:500}
.opt .dot{width:.9em;height:.9em;border-radius:50%;display:inline-block}
.opt .t{font-size:1.6em;color:var(--t1)}
.opt .p{font-size:1.8em;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;opacity:0;transition:opacity .6s .6s}
.reveal .opt .p{opacity:1}
.side{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2em;padding-bottom:4em}
.count{text-align:center}
.count .n{font-size:11em;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.count .l{font-size:1.8em;color:var(--t3);margin-top:.3em}
.ring{width:22em;height:.5em;border-radius:1em;background:rgba(255,255,255,.12);overflow:hidden}
.ring i{display:block;height:100%;width:0;background:var(--grad);transition:width .6s}
.insight{width:100%;align-self:stretch;background:linear-gradient(160deg,rgba(10,30,90,.88),rgba(4,8,52,.9));border:1px solid rgba(0,213,208,.45);border-radius:1.6em;padding:2.2em 2.4em;box-shadow:0 0 4em rgba(0,213,208,.18);backdrop-filter:blur(6px)}
.tag{display:inline-flex;align-items:center;gap:.6em;font-size:1.1em;letter-spacing:.2em;text-transform:uppercase;color:var(--aqua);font-weight:500;margin-bottom:1.1em}
.tag:before{content:"";width:.7em;height:.7em;border-radius:50%;background:var(--aqua);box-shadow:0 0 1em var(--aqua);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.insight p{font-size:1.75em;line-height:1.42;color:var(--t1);min-height:7em}
.insight p .cur{display:inline-block;width:.5em;height:1em;background:var(--aqua);vertical-align:-.12em;margin-left:.1em;animation:pulse .8s infinite}
.stat{font-size:1.4em;color:var(--t3);margin-top:1em}

/* radar */
.radar{display:grid;grid-template-columns:1fr 36em 1fr;grid-template-rows:1fr auto;column-gap:2.6em;row-gap:1em;height:100%;align-items:center;padding-top:1em}
.rcol{display:flex;flex-direction:column;gap:2em}
.rcard{background:rgba(6,12,60,.85);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:1.5em;padding:1.8em 2em;animation:fadeIn .8s ease both}
.rcard .lab{font-size:1.1em;letter-spacing:.2em;text-transform:uppercase;color:var(--t3);margin-bottom:.8em}
.rcard .big{font-size:2.2em;font-weight:700;line-height:1.15}
.rcard .small{font-size:1.4em;color:var(--t2);margin-top:.5em;line-height:1.35}
.rcenter{display:flex;flex-direction:column;align-items:center;gap:1.2em}
.rcenter svg{width:34em;height:34em;overflow:visible}
.rsum{grid-column:1/-1;text-align:center;font-size:1.9em;line-height:1.4;max-width:44em;justify-self:center;color:var(--t1);padding:.8em 1.4em;border-radius:1em;background:rgba(14,16,44,.6);border:1px solid var(--line)}
.badge{position:absolute;left:0;bottom:-4.2em;font-size:1.15em;color:var(--t3);border:1px solid var(--line);border-radius:3em;padding:.55em 1.2em;background:rgba(0,0,0,.15)}
.badge b{color:var(--aqua);font-weight:500}

/* controls */
.controls{position:fixed;left:50%;bottom:1.4em;transform:translateX(-50%);display:flex;gap:.6em;align-items:center;padding:.6em;border-radius:3em;background:rgba(10,14,34,.75);border:1px solid var(--line);backdrop-filter:blur(8px);opacity:.12;transition:opacity .3s;z-index:5;font-size:min(1vw,1.78vh)}
.controls:hover,.controls.show{opacity:1}
.controls button{font-size:1.25em;padding:.7em 1.3em;border-radius:2em;color:var(--t2)}
.controls button:hover{background:rgba(255,255,255,.08)}
.controls .primary{background:var(--grad);color:var(--navy);font-weight:700}
.controls .primary:hover{filter:brightness(1.1);background:var(--grad)}
.controls .state{font-size:1.15em;color:var(--t3);padding:0 .8em;min-width:10em;text-align:center}
.pill{position:fixed;top:1em;left:50%;transform:translateX(-50%);font-size:min(1.05vw,1.9vh);padding:.4em 1em;border-radius:2em;z-index:6;letter-spacing:.06em}
.pill.demo{background:rgba(242,184,75,.15);border:1px solid rgba(242,184,75,.6);color:#F2D08A}
.conn{position:fixed;right:1.2em;bottom:1.2em;z-index:6;font-size:min(.95vw,1.7vh);color:var(--t4);display:flex;align-items:center;gap:.5em}
.conn i{width:.7em;height:.7em;border-radius:50%;background:#2FBF8F;box-shadow:0 0 .8em #2FBF8F}
.conn.off i{background:#E5616B;box-shadow:0 0 .8em #E5616B}

/* PIN overlay */
.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(8,10,28,.75);backdrop-filter:blur(10px)}
.pinbox{background:var(--navy);border:1px solid var(--line);border-radius:1.4em;padding:2.4em;width:min(26em,90vw);display:flex;flex-direction:column;gap:1em;font-size:16px}
.pinbox h2{font-size:1.4em;font-weight:500}
.pinbox input{font:inherit;font-size:1.6em;letter-spacing:.3em;text-align:center;padding:.5em;border-radius:.6em;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff}
.pinbox button{padding:.8em;border-radius:.6em;background:var(--grad);color:var(--navy);font-weight:700}
.pinbox .err{color:#F09AA1;font-size:.9em;min-height:1.2em}

/* ================= PHONE ================= */
.phone{position:relative;z-index:1;min-height:100%;height:100%;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));font-size:16px;overflow-y:auto}
.ptop{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 14px;border-bottom:1px solid var(--line)}
.ptop img.cg{height:20px}
.ptop .ppartner{font-size:12px;font-weight:500;color:var(--t2);letter-spacing:.04em}
.ptop .ppartner b{color:var(--aqua);font-weight:500}
.pbody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:22px 2px;animation:fadeIn .5s ease both}
.pbody h1{font-size:26px;font-weight:700;line-height:1.2}
.pbody .lead{font-size:17px;color:var(--t2);line-height:1.45}
.pq{font-size:22px;font-weight:500;line-height:1.3}
.pbtns{display:flex;flex-direction:column;gap:10px}
.pbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:17px;line-height:1.3;color:var(--t1);transition:transform .15s,background .2s,border-color .2s}
.pbtn:active{transform:scale(.98)}
.pbtn i{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;color:var(--t3)}
.pbtn.sel{background:linear-gradient(90deg,rgba(29,184,242,.35),rgba(0,213,208,.22));border-color:var(--aqua)}
.pbtn.sel i{background:var(--aqua);color:var(--navy);border-color:var(--aqua)}
.pbtns.locked .pbtn:not(.sel){opacity:.45}
.done{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;border:1px solid rgba(0,213,208,.5);background:rgba(0,213,208,.08);font-size:16px;color:var(--t2)}
.orb{flex:none;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(0,213,208,.25),0 0 22px 6px rgba(0,213,208,.6)}
.pfoot{font-size:12px;color:var(--t4);text-align:center;line-height:1.5}
.pcount{font-size:13px;color:var(--t3);letter-spacing:.14em;text-transform:uppercase}

/* ===== v2 additions ===== */
.host .controls{gap:.4em}
.controls .sep{width:1px;height:1.8em;background:var(--line);margin:0 .2em}
.controls .sec{font-size:1.1em;padding:.6em .9em}
.controls .sec.on{color:var(--aqua);background:rgba(0,213,208,.12)}
.small-qr{position:absolute;right:0;bottom:0;display:flex;align-items:center;gap:1em;background:rgba(2,3,49,.75);border:1px solid var(--line);border-radius:1.2em;padding:.8em 1.2em .8em .8em;backdrop-filter:blur(6px)}
.small-qr .qrcard{padding:.5em;border-radius:.7em;box-shadow:none}
.small-qr .qrcard svg{width:8em;height:8em}
.small-qr span{font-size:1.2em;color:var(--t2);max-width:11em;line-height:1.35}
.active{font-size:1.5em;color:var(--t3);margin-top:-1.2em}
.active b{color:var(--aqua);font-weight:500}

/* break */
.breakscene{display:flex;flex-direction:column;justify-content:center;gap:2em;height:100%;max-width:60%}
.breakscene .h-xl{font-size:6em}
.breakscene .sub{font-size:2.1em;color:var(--t2);line-height:1.35}

/* use case intro */
.ucintro{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto auto;gap:2em 2.6em;height:100%;padding-top:1em;align-content:start}
.ucintro .head{grid-column:1/-1;display:flex;flex-direction:column;gap:1em}
.uccard{border-radius:1.6em;padding:2em 2.2em;background:rgba(6,12,60,.82);border:1px solid var(--line);display:flex;align-items:center;gap:1.4em;backdrop-filter:blur(6px)}
.uccard .tag2{flex:none;width:3.4em;height:3.4em;border-radius:50%;display:grid;place-items:center;font-size:1.5em;font-weight:700;color:var(--navy)}
.uccard .nm{font-size:2.6em;font-weight:700;line-height:1.15}
.critgrid{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:1.4em}
.crit{background:rgba(6,12,60,.78);border:1px solid var(--line);border-radius:1.2em;padding:1.4em 1.5em;backdrop-filter:blur(6px)}
.crit b{display:block;font-size:1.55em;font-weight:500;margin-bottom:.5em}
.crit span{font-size:1.25em;color:var(--t3);line-height:1.4}
.note{grid-column:1/-1;font-size:1.4em;color:var(--t2);display:flex;align-items:center;gap:.7em}
.note:before{content:"";width:.7em;height:.7em;border-radius:50%;background:var(--aqua);box-shadow:0 0 1em var(--aqua)}

/* vote progress (uc + co) */
.progscene{display:grid;grid-template-columns:58% 1fr;gap:3em;height:100%;padding-top:1.2em}
.progscene .names{display:flex;flex-direction:column;gap:1.2em;margin-top:2.4em}

/* bar chart */
.ucres{display:grid;grid-template-columns:minmax(0,1fr) 30em;gap:2.6em;height:100%;padding-top:.6em}
.chart{display:flex;flex-direction:column;height:100%}
.legend{display:flex;gap:1.6em;flex-wrap:wrap;font-size:1.25em;color:var(--t2);margin:1em 0 1.2em}
.legend i{display:inline-block;width:1.4em;height:.9em;border-radius:.2em;margin-right:.5em;vertical-align:-.05em}
.plot{flex:1;position:relative;margin-left:3em;margin-bottom:3.4em;min-width:0;border-left:1px solid var(--line);border-bottom:1px solid rgba(255,255,255,.3)}
.plot .gl{position:absolute;left:0;right:0;border-top:1px dashed rgba(255,255,255,.1)}
.plot .gl span{position:absolute;left:-2.4em;top:-.7em;font-size:1.1em;color:var(--t4)}
.groups{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr)}
.grp{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:.35em;padding:0 .5em}
.grp .lab{position:absolute;left:0;right:0;top:calc(100% + .4em);text-align:center;font-size:1.25em;color:var(--t2);line-height:1.15}
.cbar{position:relative;width:min(2.6em,18%);flex:none;height:0;border-radius:.5em .5em 0 0;transition:height 1.2s cubic-bezier(.2,.8,.2,1),opacity .6s}
.cbar .v{position:absolute;left:50%;top:-1.7em;transform:translateX(-50%);font-size:1.25em;font-weight:700;white-space:nowrap;opacity:0;transition:opacity .4s .9s}
.cbar.show .v{opacity:1}
.cbar.room.A{background:linear-gradient(180deg,#5FD3FF,#1DB8F2)}
.cbar.room.B{background:linear-gradient(180deg,#FFD27A,#F2B84B)}
.cbar.ai{background:repeating-linear-gradient(135deg,rgba(255,255,255,.22) 0 .35em,rgba(255,255,255,.06) .35em .7em);border:2px solid}
.cbar.ai.A{border-color:#1DB8F2}
.cbar.ai.B{border-color:#F2B84B}
.cbar.gap{margin-right:.9em}
.sidep{display:flex;flex-direction:column;gap:1.4em;justify-content:center}
.bias{font-size:1.25em;line-height:1.45;color:#F2D08A;background:rgba(242,184,75,.08);border:1px solid rgba(242,184,75,.4);border-radius:1em;padding:1em 1.2em}
.scorebox{display:grid;grid-template-columns:1fr 1fr;gap:1em}
.score{background:rgba(6,12,60,.82);border:1px solid var(--line);border-radius:1.2em;padding:1.2em 1.3em}
.score .t{font-size:1.15em;color:var(--t3);letter-spacing:.08em;text-transform:uppercase}
.score .n{font-size:3.2em;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.score .s{font-size:1.15em;color:var(--t3)}
.why{font-size:1.15em;color:var(--t2);line-height:1.45;max-height:19em;overflow:hidden;background:rgba(6,12,60,.82);border:1px solid var(--line);border-radius:1em;padding:1em 1.2em}
.why p{margin-bottom:.6em}
.why b{color:var(--t1);font-weight:500}

/* matrix */
.matrix{display:grid;grid-template-columns:1fr 34em;gap:3em;height:100%;align-items:center}
.matrix svg{width:100%;height:100%;max-height:60em;overflow:visible}

/* word cloud */
.cloudscene{display:flex;flex-direction:column;height:100%}
.cloud{position:relative;flex:1;margin-top:1em}
.word{position:absolute;white-space:nowrap;font-weight:700;line-height:1;transform:translate(-50%,-50%) scale(.2);opacity:0;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .9s;text-shadow:0 0 .6em rgba(0,213,208,.35);cursor:default}
.word.in{transform:translate(-50%,-50%) scale(1);opacity:1}
.host-mode .word{cursor:pointer}
.host-mode .word:hover{text-decoration:line-through;opacity:.6}
.hiddeninfo{position:absolute;right:0;bottom:0;font-size:1.1em;color:var(--t4)}
.hiddeninfo button{color:var(--aqua);font-size:1em;text-decoration:underline}

/* end */
.endscene{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:2em;height:100%;max-width:62%}
.endscene .sub{font-size:2.2em;color:var(--t2);line-height:1.35}

/* setup overlay */
.setup{position:fixed;inset:0;z-index:12;display:grid;place-items:center;background:rgba(2,3,30,.8);backdrop-filter:blur(10px);font-size:15px}
.setup .box{width:min(980px,94vw);max-height:92vh;overflow:auto;background:#071046;border:1px solid var(--line);border-radius:16px;padding:24px 26px;display:flex;flex-direction:column;gap:16px}
.setup h2{font-size:20px;font-weight:500}
.setup .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.setup label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--t3)}
.setup input,.setup textarea,.setup select{font:inherit;font-size:15px;color:#fff;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.setup textarea{min-height:44px;resize:vertical}
.setup table{width:100%;border-collapse:collapse}
.setup th,.setup td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
.setup th{color:var(--t3);font-weight:500}
.setup td select{width:70px}
.setup td textarea{width:100%;min-height:38px;font-size:13px}
.setup .btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.setup .btns button{padding:10px 16px;border-radius:8px;border:1px solid var(--line);color:var(--t2)}
.setup .btns .primary{background:var(--grad);color:var(--navy);font-weight:700;border:0}
.setup .msg{font-size:13px;color:var(--aqua);min-height:18px}

/* phone v2 */
.ucform{display:flex;flex-direction:column;gap:14px}
.ucblock{border:1px solid var(--line);border-radius:14px;padding:12px 12px 6px;background:rgba(6,12,60,.65)}
.ucblock h3{font-size:16px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.ucblock h3 i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;color:var(--navy)}
.crow{padding:8px 0;border-top:1px solid rgba(255,255,255,.08)}
.crow:first-of-type{border-top:0}
.crow .cl{font-size:14px;color:var(--t1);margin-bottom:2px}
.crow .ch{font-size:12px;color:var(--t3);margin-bottom:7px;line-height:1.35}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:16px;font-weight:500}
.scale button.sel{background:var(--grad);color:var(--navy);border-color:transparent}
.scale-l{display:flex;justify-content:space-between;font-size:11px;color:var(--t4);margin-top:4px}
.submit{width:100%;padding:15px;border-radius:14px;background:var(--grad);color:var(--navy);font-weight:700;font-size:17px}
.submit:disabled{opacity:.35}
.winput{width:100%;font:inherit;font-size:18px;color:#fff;background:rgba(6,12,60,.7);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.winput:focus{outline:none;border-color:var(--aqua)}
.hint{font-size:12px;color:var(--t4)}
.controls button{white-space:nowrap}

/* ===== stacked rating chart (v2.1) ===== */
.ucres2{display:flex;flex-direction:column;height:100%;padding-top:.4em}
.uchead{display:flex;justify-content:space-between;align-items:flex-end;gap:2em}
.wctl{display:flex;align-items:center;gap:.8em;font-size:1.2em;color:var(--t3);background:rgba(2,3,49,.7);border:1px solid var(--line);border-radius:3em;padding:.5em .6em .5em 1.2em;opacity:0;transform:translateY(-.6em);transition:opacity .6s,transform .6s;pointer-events:none;backdrop-filter:blur(6px)}
.s3 .wctl{opacity:1;transform:none;pointer-events:auto}
.wctl input{width:11em;accent-color:#00D5D0}
.wctl b{color:var(--t1);min-width:2.8em;font-variant-numeric:tabular-nums}
.wctl button{font-size:.9em;color:var(--aqua);border:1px solid rgba(0,213,208,.5);border-radius:2em;padding:.35em .9em}
.wctl button:hover{background:rgba(0,213,208,.12)}
.legend2{display:flex;align-items:center;gap:1.4em;font-size:1.2em;color:var(--t2);margin:1.1em 0 .6em}
.legend2 i{display:inline-block;width:1em;height:1em;border-radius:.25em;margin-right:.45em;vertical-align:-.12em}
.legend2 .sp{width:1px;height:1.1em;background:var(--line)}
.lg-ai{background:repeating-linear-gradient(135deg,#fff 0 3px,transparent 3px 6px);border:1px solid #fff}
.lg-room{background:#fff}
.lg-all{background:linear-gradient(180deg,#fff,#00D5D0);box-shadow:0 0 .6em #00D5D0}
.stackplot{position:relative;flex:1;min-height:0;margin:1.4em 7em 6.6em 2.6em;display:flex;justify-content:space-around;align-items:stretch;border-bottom:1px solid rgba(255,255,255,.35)}
.stackplot .gl{position:absolute;left:0;right:0;border-top:1px dashed rgba(255,255,255,.08)}
.stackplot .gl span{position:absolute;left:-2.2em;top:-.65em;font-size:1.05em;color:var(--t4)}
.case{position:relative;display:flex;gap:2.2em;align-items:stretch;padding:0 1.6em}
.cname{position:absolute;left:0;right:0;top:calc(100% + 1.9em);text-align:center;font-size:1.55em;font-weight:500;white-space:nowrap}
.cname span{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;color:#020331;font-size:.8em;font-weight:700;margin-right:.5em;vertical-align:.1em}
.stk{position:relative;width:6.4em}
.stk .blab{position:absolute;left:-1em;right:-1em;top:calc(100% + .6em);text-align:center;font-size:1.15em;color:var(--t3);letter-spacing:.12em;text-transform:uppercase}
.stk .ghost{position:absolute;left:0;right:0;bottom:0;height:62%;border:1.5px dashed rgba(255,255,255,.18);border-bottom:0;border-radius:.6em .6em 0 0;display:grid;place-items:center;transition:opacity .6s}
.stk .ghost span{font-size:2.6em;color:rgba(255,255,255,.18);font-weight:700;animation:pulse 2.2s infinite}
.stk.on .ghost{opacity:0}
.seg{position:absolute;left:0;right:0;height:0;bottom:0;border-radius:.35em;transition:height 1.1s cubic-bezier(.2,.9,.25,1),bottom 1.1s cubic-bezier(.2,.9,.25,1);box-shadow:inset 0 0 0 1.5px rgba(2,3,49,.9);overflow:hidden;display:grid;place-items:center}
.seg em{font-style:normal;font-size:1.15em;font-weight:700;color:#020331;opacity:.85;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.stk.ai .seg{background:repeating-linear-gradient(135deg,var(--c) 0 .5em,color-mix(in srgb,var(--c) 38%,#020331) .5em 1em)}
.stk.ai .seg em{color:#fff;text-shadow:0 1px 3px #020331}
.stk.room .seg{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c))}
.stk.all .seg{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 55%,#fff),var(--c));box-shadow:inset 0 0 0 1.5px rgba(2,3,49,.9),0 0 1.4em color-mix(in srgb,var(--c) 70%,transparent)}
.stk.all.on::after{content:"";position:absolute;inset:auto 0 0 0;height:100%;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);background-size:250% 100%;animation:shimmer 3.2s ease-in-out infinite;mix-blend-mode:overlay;border-radius:.4em}
@keyframes shimmer{0%{background-position:150% 0}100%{background-position:-60% 0}}
.stk .tot{position:absolute;left:50%;bottom:0;transform:translate(-50%,-.4em);white-space:nowrap;opacity:0;transition:bottom 1.1s cubic-bezier(.2,.9,.25,1),opacity .5s}
.stk .tot.show{opacity:1}
.stk .tot b{font-size:2.2em;font-weight:700;font-variant-numeric:tabular-nums}
.stk .tot small{font-size:1.05em;color:var(--t3);margin-left:.15em}
.stk.win .tot b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stk.win .tot::before{content:"★ LEADER";position:absolute;left:50%;bottom:100%;transform:translateX(-50%);font-size:.95em;letter-spacing:.18em;color:var(--aqua);text-shadow:0 0 .8em var(--aqua);white-space:nowrap;animation:pulse 1.8s infinite}
.stk.win .seg{animation:winglow 2.4s ease-in-out infinite}
@keyframes winglow{50%{filter:brightness(1.18) drop-shadow(0 0 .5em rgba(0,213,208,.55))}}
.s1 .stk.room,.s1 .stk.all,.s2 .stk.all{opacity:.55}
.ucline{display:flex;align-items:center;gap:1.2em;font-size:1.55em;color:var(--t1);background:rgba(2,3,49,.72);border:1px solid var(--line);border-radius:3em;padding:.6em 1.4em;align-self:flex-start;max-width:100%;backdrop-filter:blur(6px);margin-bottom:.2em}
.ucline .tag{margin:0;font-size:.7em;flex:none}
.ucline b{color:var(--aqua);font-weight:500}
.ucline .biasmini{font-size:.7em;color:#F2D08A;border-left:1px solid var(--line);padding-left:1.1em;flex:none}

/* ===== v3: headroom above bars, AI mode control ===== */
.stackplot .gridbox{position:absolute;left:0;right:0;top:4.6em;bottom:0;pointer-events:none}
.case{margin-top:4.6em}
.wctl{gap:.9em;padding:.45em .6em .45em 1.1em}
.wctl .wl{white-space:nowrap}
.wseg{display:flex;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:2em;padding:.18em}
.wseg button{font-size:.95em;color:var(--t2);padding:.38em .85em;border-radius:2em;white-space:nowrap;transition:background .3s,color .3s}
.wseg button.on{background:var(--grad);color:var(--navy);font-weight:700;box-shadow:0 0 1em rgba(0,213,208,.45)}
.wmix{display:flex;width:7em;height:.55em;border-radius:1em;overflow:hidden;background:rgba(255,255,255,.1)}
.wmix .wr{background:linear-gradient(90deg,#1DB8F2,#00D5D0);transition:width .8s cubic-bezier(.2,.9,.25,1)}
.wmix .wa{background:repeating-linear-gradient(135deg,#fff 0 3px,rgba(255,255,255,.35) 3px 6px);transition:width .8s cubic-bezier(.2,.9,.25,1)}
.wpct{white-space:nowrap;font-size:.95em;color:var(--t3);min-width:9.5em}
.wpct b{color:var(--t1);font-weight:500}

/* ===== v3: live word cloud ===== */
.cloudscene{display:flex;flex-direction:column;height:100%}
.cloudhead{display:flex;justify-content:space-between;align-items:flex-end;gap:2em}
.cloudhead .h-q{font-size:2.7em}
.cchip{display:flex;align-items:center;gap:.7em;background:rgba(2,3,49,.72);border:1px solid var(--line);border-radius:3em;padding:.55em 1.2em;font-size:1.3em;color:var(--t3);backdrop-filter:blur(6px);white-space:nowrap}
.cchip b{font-size:1.6em;color:var(--t1);font-variant-numeric:tabular-nums}
.ring2{display:inline-block;width:6em;height:.45em;border-radius:1em;background:rgba(255,255,255,.12);overflow:hidden}
.ring2 i{display:block;height:100%;width:0;background:var(--grad);transition:width .6s}
.cloud{position:relative;flex:1;min-height:0;margin:1.2em 6em .6em 0}
.cloudfoot{font-size:1.1em;color:var(--t4);text-align:right;margin-right:6em}
.cloudfoot button{color:var(--aqua);font-size:1em;text-decoration:underline;margin-left:.3em}
.cloud-empty{position:absolute;inset:0;display:grid;place-items:center;font-size:2em;color:var(--t3);animation:pulse 2.2s infinite}
.word{position:absolute;white-space:nowrap;line-height:1;transform:translate(-50%,-50%) scale(.3);opacity:0;
  transition:left .9s cubic-bezier(.2,.9,.25,1),top .9s cubic-bezier(.2,.9,.25,1),font-size .9s cubic-bezier(.2,.9,.25,1),transform .7s cubic-bezier(.2,.9,.25,1),opacity .6s,color .6s;
  text-shadow:0 0 .5em rgba(0,213,208,.35);cursor:pointer}
.word.in{transform:translate(-50%,-50%) scale(1);opacity:1}
.word.gone{opacity:0;transform:translate(-50%,-50%) scale(.4)}
.word.bump{animation:bump .8s ease}
@keyframes bump{0%{text-shadow:0 0 .5em rgba(0,213,208,.35)}35%{text-shadow:0 0 1.2em #fff,0 0 2em #00D5D0;filter:brightness(1.4)}100%{text-shadow:0 0 .5em rgba(0,213,208,.35)}}
.final .word.top{text-shadow:0 0 .6em rgba(255,255,255,.7),0 0 1.6em rgba(0,213,208,.8);animation:winglow 2.4s ease-in-out infinite}
.word:hover{text-decoration:line-through;opacity:.6}
.wmeasure{position:absolute;left:-9999px;top:-9999px;visibility:hidden;white-space:nowrap;line-height:1;font-family:Ubuntu,system-ui,sans-serif}

/* ===== v3: setup score picker ===== */
.setup .pick{display:inline-flex;gap:3px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:8px;padding:3px}
.setup .pick button{width:28px;height:30px;border-radius:6px;color:var(--t2);font-size:14px;font-weight:500}
.setup .pick button:hover{background:rgba(255,255,255,.1)}
.setup .pick button.on{background:var(--grad);color:var(--navy);font-weight:700}

/* ===== v3 layout hardening ===== */
.controls{opacity:0}
.controls:hover,.controls.show{opacity:1}
.cname{white-space:normal;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding:0 .2em}
.radar{grid-template-rows:minmax(0,1fr) auto}
.rcenter svg{width:min(34em,52vh);height:min(34em,52vh)}
.rsum{font-size:1.75em;padding:.6em 1.2em}
.lobby .left{gap:2em}
/* keep every content block clear of the dense fibre core on the right */
.scene{inset:0 max(3.6em,12vh) 5.5em 3.6em}
.legend2{align-self:flex-start}
.stackplot{margin-right:2.5em}
.cloud{margin-right:1.5em}
.cloudfoot{margin-right:1.5em}

/* ===== v3.1: modern AI bars (glass outline instead of stripes) ===== */
.stk.ai .seg{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 30%,transparent),color-mix(in srgb,var(--c) 12%,transparent));
  box-shadow:inset 0 0 0 1.5px var(--c),inset 0 0 1.4em color-mix(in srgb,var(--c) 30%,transparent),0 0 .8em color-mix(in srgb,var(--c) 22%,transparent);backdrop-filter:blur(3px)}
.stk.ai .seg em{color:#fff;text-shadow:0 1px 6px rgba(2,3,49,.9)}
.stk.ai .blab::before{content:"✦ ";color:var(--aqua)}
.lg-ai{background:rgba(255,255,255,.12);border:1.5px solid #fff;box-shadow:0 0 .5em rgba(255,255,255,.35)}

/* ===== v3.1: calmer motion ===== */
.h-xl,.h-q,.rsum{transition:opacity .6s ease}
.pxsoft{opacity:0!important;transition:none!important}
.w.rise{display:inline-block;animation:wrise .6s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes wrise{from{opacity:0;transform:translateY(.35em);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}

/* ===== v3.1: closing = final cloud + thank you ===== */
.endline{display:flex;justify-content:space-between;align-items:center;gap:1.5em;font-size:1.25em;color:var(--t2);max-height:0;opacity:0;overflow:hidden;transition:opacity .8s .4s,max-height .8s}
.final .endline{max-height:4em;opacity:1;margin-top:.5em}
.badge2{border:1px solid var(--line);border-radius:3em;padding:.45em 1.1em;background:rgba(2,3,49,.6);color:var(--t3);white-space:nowrap}
.badge2 b{color:var(--aqua);font-weight:500}
.final .cloudfoot{display:none}

/* ===== v3.1: host bar close button ===== */
.controls .xclose{font-size:1.05em;color:var(--t3);padding:.6em .9em;margin-left:.2em;border-left:1px solid var(--line);border-radius:0 2em 2em 0}
.controls .xclose:hover{color:#fff;background:rgba(229,97,107,.25)}
.controls #bExport{font-size:1.4em;padding:.45em .9em}

.controls.closed,.controls.closed:hover{opacity:0!important;pointer-events:none}

/* ===== v3.2: closing pulse (phone sliders) ===== */
.slq{border:1px solid var(--line);border-radius:14px;padding:12px 14px 8px;background:rgba(6,12,60,.65);transition:border-color .3s}
.slq:not(.unset){border-color:rgba(0,213,208,.55)}
.slt{font-size:15px;line-height:1.35;color:var(--t1);margin-bottom:8px}
.slrow{display:flex;align-items:center;gap:12px}
.slrow output{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:17px;background:var(--grad);color:var(--navy);transition:transform .2s}
.slq.unset .slrow output{background:rgba(255,255,255,.08);color:var(--t3)}
.slrow input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:30px;background:transparent;--p:55.5%}
.slrow input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(90deg,#1DB8F2,#00D5D0) 0/var(--p) 100% no-repeat,rgba(255,255,255,.14)}
.slrow input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:rgba(255,255,255,.14)}
.slrow input[type=range]::-moz-range-progress{height:8px;border-radius:8px;background:linear-gradient(90deg,#1DB8F2,#00D5D0)}
.slrow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 0 0 4px rgba(0,213,208,.35),0 0 16px rgba(0,213,208,.7)}
.slrow input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(0,213,208,.35),0 0 16px rgba(0,213,208,.7)}
.slq.unset .slrow input[type=range]::-webkit-slider-runnable-track{background:rgba(255,255,255,.14)}
.slq.unset .slrow input[type=range]::-webkit-slider-thumb{background:rgba(255,255,255,.55);box-shadow:0 0 0 4px rgba(255,255,255,.08);animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}

/* ===== v3.2: closing gauges on the beamer ===== */
.endline{align-items:flex-end}
.gauges{display:flex;gap:2.2em}
.gauge{display:flex;align-items:center;gap:.8em;background:rgba(2,3,49,.62);border:1px solid var(--line);border-radius:3em;padding:.35em 1.3em .35em .4em;backdrop-filter:blur(6px)}
.gauge svg{width:3.6em;height:3.6em;transform:rotate(-90deg)}
.gauge .gt{fill:none;stroke:rgba(255,255,255,.12);stroke-width:10}
.gauge .gv{fill:none;stroke:url(#none);stroke:#00D5D0;stroke-width:10;stroke-linecap:round;transition:stroke-dasharray 1.4s cubic-bezier(.2,.9,.25,1);filter:drop-shadow(0 0 6px rgba(0,213,208,.7))}
.gauge b{font-size:2.2em;font-weight:700;min-width:1.7em;font-variant-numeric:tabular-nums}
.gauge span{display:flex;flex-direction:column;font-size:1.05em;color:var(--t1);line-height:1.25}
.gauge small{font-size:.85em;color:var(--t3)}
.endright{display:flex;flex-direction:column;align-items:flex-end;gap:.5em}
.endright #endstats{font-size:.95em;color:var(--t3)}

/* gauges v2: value inside the ring, single-line labels, room to breathe */
.final .endline{max-height:9em}
.gauge{padding:.45em 1.5em .45em .45em;gap:1em}
.gring{position:relative;width:4.6em;height:4.6em;flex:none}
.gring svg{width:100%;height:100%;transform:rotate(-90deg)}
.gring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.55em;min-width:0}
.gauge span{white-space:nowrap;font-size:1.2em;font-weight:500}
.gauge small{font-weight:400}
.endright{margin-right:clamp(2em,9vw,11em)}
.endright .badge2{font-size:.85em}
/* event-day: reserve the closing line's space already in the live cloud, so the cloud never shrinks when the gauges appear */
.cloudscene .endline{max-height:9em;visibility:hidden;opacity:0;margin-top:.5em}
.cloudscene.final .endline{visibility:visible;opacity:1}
/* ===== section start screens (uc_start, co_start) — mirror the PowerPoint transition slides ===== */
.secstart{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6em;height:100%;padding-bottom:3em}
.secstart .left{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.secstart .num{font-size:15em;font-weight:700;line-height:.8;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:-.12em}
.secstart .eyebrow{margin-bottom:.5em}
.secstart .sub{font-size:2.4em;color:var(--t2);margin-top:.6em;max-width:20em;line-height:1.3}
.steps3{display:flex;gap:1em;margin-top:2.2em}
.steps3 div{font-size:1.25em;letter-spacing:.14em;text-transform:uppercase;color:var(--t4,var(--t3));border:1px solid var(--line);border-radius:2em;padding:.45em 1.1em;background:rgba(2,3,49,.5)}
.steps3 div.on{color:var(--navy);background:var(--grad);border-color:transparent;font-weight:700}
.livepill{display:inline-flex;align-items:center;gap:.8em;margin-top:2.4em;font-size:1.6em;letter-spacing:.06em;color:var(--t2);border:1px solid rgba(0,213,208,.5);border-radius:3em;padding:.6em 1.4em;background:rgba(2,3,49,.6)}
.livepill i{width:.8em;height:.8em;border-radius:50%;background:var(--aqua);box-shadow:0 0 1em var(--aqua),0 0 2.2em var(--aqua);animation:pulse 2.2s infinite}
.livepill b{color:#fff;font-weight:700;font-variant-numeric:tabular-nums}
.livepill .act{color:var(--t3)}
.livepill .act:not(:empty)::before{content:"·";margin-right:.8em;color:var(--t3)}
.secstart .qrbox{display:flex;flex-direction:column;align-items:center;gap:1.2em}
.secstart .qrbox .qrcard svg{width:19em;height:19em;display:block}
.secstart .qrbox span{font-size:1.45em;color:var(--t2);text-align:center;line-height:1.4}
.secstart .qrbox b{color:#fff;font-weight:500}
</style>

<body>
<canvas id="bg"></canvas>
<canvas id="px"></canvas>

<!-- HOST / BEAMER -->

        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );

          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';

        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;

        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);

        break;

  function countUp(el, to){ if (!el) return; const from = +el.dataset.v || 0; el.dataset.v = to; const t0 = performance.now(), d = 900;
    const f = n => { const k = Math.min(1,(n-t0)/d), e = 1-Math.pow(1-k,3); el.textContent = fmt1(from + (to-from)*e); if (k<1) requestAnimationFrame(f); }; requestAnimationFrame(f); }
  function setStacks(){

    { const nR = Math.max(A.uc.A[0].n, A.uc.B[0].n), sh = aiShare(CFGD.aiMode, nR);

      if (visible && any) countUp(tot.querySelector("b"), cum);

      body.innerHTML = `<div class="pcount">Thank you</div><h1>That's a wrap for the <span class="grad-text">Room Radar</span>.</h1><p class="lead">Thanks for your energy tonight. Enjoy the networking!</p>`;
    }
    if (DEMO){ const b = $("#dNext"); if (b) b.onclick = demoNext; if (!b && !["ci_vote","uc_vote","co_collect"].includes(P)){ body.insertAdjacentHTML("beforeend", `<button class="pbtn" id="dNext2"><i>▶</i>Demo: next step</button>`); $("#dNext2").onclick = demoNext; } }
  }
  function demoNext(){ const i = SEQ.findIndex(s => s.q===demoS.q && s.phase===demoS.phase); const n = SEQ[i+1] || SEQ[0]; demoS = { ...demoS, q:n.q, phase:n.phase }; S = demoS; render(true); }
  async function voteCi(i){
    if (store.get(doneKey(S.session,"ci"+S.q)) !== null) return;
    if (navigator.vibrate) try { navigator.vibrate(30); } catch(e){}
    if (DEMO){ setDone("ci"+S.q, i); render(true); setTimeout(demoNext, 1200); return; }
    const btns = body.querySelectorAll(".pbtn"); btns.forEach(b => b.disabled = true);
    try { await postAnswers([{ session:S.session, item:"ci"+S.q, num:i, device:DEVICE }]); setDone("ci"+S.q, i); render(true); }
    catch(e){ btns.forEach(b => b.disabled = false); alert("Your vote didn't go through. Please tap again."); }
  }
  async function sendUc(){
    const btn = $("#ucSend"); btn.disabled = true; btn.textContent = "Sending…";
    const rows = []; for (const u of ["A","B"]) for (let c=1;c<=4;c++) rows.push({ session:S.session, item:"u"+u+c, num:draft["u"+u+c], device:DEVICE });
    if (DEMO){ setDone("uc",1); render(true); return; }
    try { await postAnswers(rows); setDone("uc",1); draft = {}; render(true); }
    catch(e){ btn.disabled = false; btn.textContent = "Send rating"; alert("Your rating didn't go through. Please tap send again."); }
  }
  async function sendCo(){
    const words = [1,2,3].map(i => cleanWord($("#w"+i).value)).filter(Boolean), fbv = [0,1].map(i => +$("#sl"+i).value);
    if (!words.length) return; const btn = $("#coSend"); btn.disabled = true; btn.textContent = "Sending…";
    if (DEMO){ setDone("co",1); render(true); return; }
    const rows = words.map((w,i) => ({ session:S.session, item:"co"+(i+1), txt:w, num:null, device:DEVICE })).concat(fbv.map((v,i) => ({ session:S.session, item:"fb"+(i+1), txt:null, num:v, device:DEVICE })));
    try { await postAnswers(rows); setDone("co",1); render(true); }
    catch(e){ btn.disabled = false; btn.textContent = "Send check-out"; alert("Your check-out didn't go through. Please tap send again."); }
  }
  async function tick(){
    tickN++;
    if (DEMO){ if (!S){ S = demoS; CF = normCfg({ucA:"Change Story Generator", ucB:"Training Needs Navigator"}); } render(); return; }
    try {
      S = await getState(); failures = 0;
      if (tickN % 4 === 1 || S.phase.startsWith("uc")) { try { CF = await getConfig(); } catch(e){} }
      if (joinedSession !== S.session){ try { await postAnswers([{ session:S.session, item:"join", num:0, device:DEVICE }]); joinedSession = S.session; draft = {}; } catch(e){} }
      if (Date.now() - lastPing > PING_MS){ lastPing = Date.now(); rpc("rr_ping", { p_session:S.session, p_device:DEVICE }).catch(()=>{}); }
    } catch(e){ failures++; if (failures === 3 && !S) body.innerHTML = `<div class="pcount">No connection</div><h1>Retrying…</h1><p class="lead">Check your mobile data or Wi-Fi. The page reconnects automatically.</p>`; }
    render();
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden){ lastPing = 0; tick(); } });
  tick(); setInterval(tick, POLL_MS + 300);
}

/* ============ BOOT ============ */
IS_HOST ? startHost() : startPhone();
</script>
</body>
